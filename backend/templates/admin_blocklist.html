<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocklist - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      color: #e8e8ed;
      min-height: 100vh;
      padding: 2rem;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    
    h1 { font-size: 2rem; font-weight: 700; color: #fff; }
    .nav-links a { color: #8888a0; text-decoration: none; margin-left: 1.5rem; }
    .nav-links a:hover { color: #00d9ff; }
    
    .add-form {
      background: rgba(255,255,255,0.02);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    
    input[type="text"] {
      flex: 1;
      min-width: 300px;
      padding: 0.75rem 1rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background: rgba(15,15,30,0.8);
      color: #fff;
      font-size: 0.95rem;
    }
    
    button {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(90deg, #f87171, #dc2626);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    
    table {
      width: 100%;
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      overflow: hidden;
    }
    
    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    
    th {
      background: rgba(255,255,255,0.03);
      font-weight: 600;
      color: #8888a0;
      font-size: 0.85rem;
    }
    
    .url-cell {
      font-family: monospace;
      font-size: 0.85rem;
      color: #f87171;
    }
    
    .remove-btn {
      padding: 0.5rem 1rem;
      background: rgba(248,113,113,0.1);
      color: #f87171;
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    
    .remove-btn:hover {
      background: rgba(248,113,113,0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🚫 Blocklist</h1>
      <nav class="nav-links">
        <a href="/admin">Dashboard</a>
        <a href="/admin/sites">Sitios</a>
        <a href="/admin/blocklist" class="active">Blocklist</a>
        <a href="/admin/actions">Acciones</a>
      </nav>
    </header>
    
    <form class="add-form" action="/admin/blocklist/add" method="post">
      <input type="text" name="url" placeholder="URL .onion a bloquear..." required>
      <input type="text" name="reason" placeholder="RazÃ³n (opcional)" value="Manual block">
      <button type="submit">Bloquear</button>
    </form>
    
    <table>
      <thead>
        <tr>
          <th>URL</th>
          <th>RazÃ³n</th>
          <th>Agregado</th>
          <th>AcciÃ³n</th>
        </tr>
      </thead>
      <tbody>
        {% for item in blocked %}
        <tr>
          <td class="url-cell">{{ item.url }}</td>
          <td>{{ item.reason }}</td>
          <td>{{ item.added_at.strftime('%Y-%m-%d %H:%M') }}</td>
          <td>
            <form action="/admin/blocklist/remove/{{ item.id }}" method="post" style="display:inline;">
              <button type="submit" class="remove-btn">Eliminar</button>
            </form>
          </td>
        </tr>
        {% else %}
        <tr>
          <td colspan="4" style="text-align:center; color:#666680; padding:2rem;">
            No hay sitios bloqueados
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
