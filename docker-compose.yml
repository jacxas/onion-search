services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: faro
      POSTGRES_PASSWORD: faro
      POSTGRES_DB: faro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faro -d faro"]
      interval: 5s
      timeout: 3s
      retries: 10

  tor:
    image: dperson/torproxy:latest
    volumes:
      - ./torrc.example:/etc/tor/torrc:ro
      - tordata:/var/lib/tor
    restart: unless-stopped

  app:
    build:
      context: .
      target: runner
    depends_on:
      db:
        condition: service_healthy
      tor:
        condition: service_started
    environment:
      DATABASE_URL: postgres://faro:faro@db:5432/faro
      CRAWL_MODE: live
      TOR_SOCKS_PROXY: socks5h://tor:9050
      # TOR_SEED_URLS: "http://<hub1>.onion/,http://<hub2>.onion/"
      # ADMIN_TOKEN: "cambiame"
    ports:
      - "3000:3000"   # acceso clearnet local (la interfaz onion sale por tor:9050)

  # Worker persistente (WORK-01): es el ÚNICO proceso que programa las
  # ejecuciones — seed → crawl → health → sleep → repeat. /ops solo observa
  # y ordena acciones puntuales. El admin inicial se provisiona aquí en el
  # primer arranque (SEC-01: compose exige credenciales en producción).
  worker:
    build:
      context: .
      target: runner
    command: node .worker-build/worker/crawler.js
    depends_on:
      db:
        condition: service_healthy
      tor:
        condition: service_started
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://faro:faro@db:5432/faro
      CRAWL_MODE: live
      TOR_SOCKS_PROXY: socks5h://tor:9050
      WORKER_INTERVAL_SECONDS: "900"
      WORKER_MAX_PAGES: "60"
      WORKER_HEALTH_LIMIT: "40"
      NODE_ENV: production
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:?definí ADMIN_INITIAL_EMAIL en el entorno}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?definí ADMIN_INITIAL_PASSWORD en el entorno (≥8, no default)}

  # aplicar el esquema una sola vez (incluye el índice GIN FTS, DB-01)
  migrate:
    build:
      context: .
      target: migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://faro:faro@db:5432/faro
    profiles: ["migrate"]

volumes:
  pgdata:
  tordata:
