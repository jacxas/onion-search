version: '3.8'

services:
  tor:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: onion-search-tor
    restart: unless-stopped
    volumes:
      - tor_data:/var/lib/tor
      - ./config/torrc:/etc/tor/torrc:ro
    ports:
      - "9050:9050"
      - "9051:9051"
      - "8080:80"
    networks:
      - onion-net

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: onion-search-meili
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-dev-master-key}
      - MEILI_ENV=production
    volumes:
      - meili_data:/meili_data
    networks:
      - onion-net

  db:
    image: postgres:15-alpine
    container_name: onion-search-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=onion_search
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - onion-net

  crawler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: onion-search-crawler
    restart: unless-stopped
    depends_on:
      - tor
      - meilisearch
      - db
    environment:
      - TOR_SOCKS_HOST=tor
      - TOR_SOCKS_PORT=9050
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-dev-master-key}
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/onion_search
    volumes:
      - ./crawler:/app/crawler
      - ./seed_list.txt:/app/seed_list.txt:ro
      - ./blocklist.txt:/app/blocklist.txt:ro
    networks:
      - onion-net
    command: python -m crawler.spider

  health_checker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: onion-search-health
    restart: unless-stopped
    depends_on:
      - tor
      - db
    environment:
      - TOR_SOCKS_HOST=tor
      - TOR_SOCKS_PORT=9050
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/onion_search
      - HEALTH_CHECK_INTERVAL=3600
      - HEALTH_CHECK_TIMEOUT=15
    volumes:
      - ./health_checker:/app/health_checker
    networks:
      - onion-net
    command: python -m health_checker.checker

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: onion-search-backend
    restart: unless-stopped
    depends_on:
      - tor
      - meilisearch
      - db
    ports:
      - "8000:8000"
    environment:
      - TOR_SOCKS_HOST=tor
      - TOR_SOCKS_PORT=9050
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-dev-master-key}
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/onion_search
      - ADMIN_TOKEN=${ADMIN_TOKEN:-admin-secret-token}
    volumes:
      - ./backend:/app/backend
    networks:
      - onion-net
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

volumes:
  tor_data:
  meili_data:
  pg_data:

networks:
  onion-net:
    driver: bridge
