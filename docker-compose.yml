services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: faro
      POSTGRES_PASSWORD: faro
      POSTGRES_DB: faro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faro -d faro"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  meili:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: dev-master-key
      MEILI_ENV: production
    volumes:
      - meilidata:/meili_data
    restart: on-failure

  tor:
    image: dperson/torproxy:latest
    volumes:
      - ./torrc.example:/etc/tor/torrc:ro
      - tordata:/var/lib/tor
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      tor:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://faro:faro@db:5432/faro
      CRAWL_MODE: live
      TOR_SOCKS_PROXY: socks5h://tor:9050
      MEILI_URL: http://meili:7700
      MEILI_MASTER_KEY: dev-master-key
      FARO_SEED: "0"
      # ADMIN_TOKEN: "cambiame"
      # TOR_SEED_URLS: "http://<hub1>.onion/,http://<hub2>.onion/"
    ports:
      - "3000:3000"
    restart: on-failure

volumes:
  pgdata:
  meilidata:
  tordata:
