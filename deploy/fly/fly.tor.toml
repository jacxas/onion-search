# FARO en Fly.io — variante con Tor integrado (modo live)
#
#   fly deploy --config deploy/fly/fly.tor.toml
#
# Usa deploy/fly/Dockerfile.tor: instala tor, expone SOCKS5 en 127.0.0.1:9050
# y publica el portal como servicio oculto v3.
#
# Volumen recomendado para conservar la clave del .onion entre deploys:
#   fly volumes create faro_tor --size 1 --region gru
#
# FARO en Fly.io
#
# Dos grupos de proceso desde la misma imagen:
#   app    → uvicorn sirviendo el portal (HTTP público)
#   worker → scripts/worker.py (salud + rastreo programados, sin HTTP)
#
# Requisitos previos (ver deploy/fly/README.md):
#   fly mpg create --name faro-db
#   fly mpg attach faro-db --app faro-onion
#   fly secrets set ADMIN_TOKEN=...

app = "faro-onion"
primary_region = "gru"   # São Paulo: cerca de Argentina

[build]
  dockerfile = "deploy/fly/Dockerfile.tor"

[env]
  PORT = "3000"
  # live = tráfico real por el Tor local que levanta el entrypoint
  CRAWL_MODE = "live"
  TOR_SOCKS_PROXY = "socks5h://127.0.0.1:9050"
  # 1 = carga la semilla demo si las tablas están vacías (idempotente).
  # Poner en "0" en producción con semillas reales.
  FARO_SEED = "0"
  # Meilisearch es opcional: sin MEILI_URL la búsqueda usa el motor local.
  # MEILI_URL = "https://faro-meili.flycast:7700"
  HEALTH_INTERVAL_MIN = "30"
  CRAWL_INTERVAL_MIN = "180"

[processes]
  app = "uvicorn backend.main:app --host 0.0.0.0 --port 3000"
  worker = "python -m scripts.worker --no-crawl"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["worker"]

# Solo la app publica el .onion: el volumen guarda su clave privada.
# (Los volúmenes de Fly se atan a una única máquina: no los montes en worker.)
[[mounts]]
  source = "faro_tor"
  destination = "/var/lib/tor"
  processes = ["app"]

[deploy]
  strategy = "rolling"
